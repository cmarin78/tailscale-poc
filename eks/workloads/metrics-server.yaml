# EKS-like workload: metrics-server (simulates AWS CloudWatch + Prometheus adapter)
# =========================================================================
# This is what an SRE or auditor consume via tag:eks-gateway:9100
# in the POC. In prod it would be an EKS cluster with metrics-server + adapter.
# =========================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-server
  namespace: helios-staging
---
apiVersion: v1
kind: Pod
metadata:
  name: metrics-server
  namespace: helios-staging
  labels:
    app: metrics-server
    tier: observability
spec:
  serviceAccountName: metrics-server
  containers:
  - name: metrics
    image: mcr.microsoft.com/aks/hcp/hcp-base-image:1.0.4-linux-musl
    # No hace nada real — simulamos
    command: ["/bin/sh", "-c", "sleep infinity"]
    ports:
    - containerPort: 9100
      name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-server
  namespace: helios-staging
  labels:
    app: metrics-server
spec:
  selector:
    app: metrics-server
  ports:
  - port: 9100
    targetPort: 9100
    name: metrics
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: metrics-server
  namespace: helios-staging
  labels:
    kubernetes.io/service-name: metrics-server
addressType: IPv4
endpoints:
  - addresses:
      # IP del pod (cambia en cada deploy — placeholder)
      - 100.96.0.10
    conditions:
      ready: true
    nodeName: helios-eks-sim-worker
ports:
  - name: metrics
    port: 9100
    protocol: TCP
