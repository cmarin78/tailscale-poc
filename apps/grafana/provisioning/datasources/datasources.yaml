apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # Grafana runs in a network namespace shared with ts-grafana (tailscale sidecar).
    # "observability" is the MagicDNS hostname of the metrics service in the tailnet.
    url: http://observability:9100
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
